<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Arthur 3D</title>
<style>
  body { font-family: sans-serif; background: #101418; color: #eee; text-align: center; padding: 3em 1em; }
  a.botao { display: block; max-width: 22em; margin: 1em auto; padding: 1em; background: #e07b2a; color: #fff;
            text-decoration: none; border-radius: 0.6em; font-size: 1.2em; }
  a.secundario { background: #2a323a; }
</style>
<script>
(function () {
  // Casa Arthur 3D — duas versoes no mesmo endereco:
  // telemovel/tablet -> leve/ (GLB leve, texturas <=512 px, render 0,5x)
  // computador       -> pc/   (versao completa)
  // Escolha manual: acrescentar ?v=leve ou ?v=pc ao endereco.
  var forcar = new URLSearchParams(location.search).get('v');
  var destino;
  if (forcar === 'leve' || forcar === 'pc') {
    destino = forcar;
  } else {
    var ua = navigator.userAgent || '';
    var uaMovel = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    var toque = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var ecraPequeno = Math.min(screen.width, screen.height) <= 820;
    destino = (uaMovel || (toque && ecraPequeno)) ? 'leve' : 'pc';
  }
  location.replace(destino + '/' + location.hash);
})();
</script>
</head>
<body>
  <h1>Casa Arthur 3D</h1>
  <p>A abrir o jogo… Se não abrir sozinho, escolhe a tua versão:</p>
  <a class="botao" href="leve/">Versão telemóvel (mais leve)</a>
  <a class="botao secundario" href="pc/">Versão computador (completa)</a>
</body>
</html>
